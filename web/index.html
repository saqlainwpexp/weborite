<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup Studio</title>
    <style>
      /* Startup splash: shown from first paint until React mounts, so there's no white flash. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #e6e5e5; transition: opacity .32s ease; opacity: 1;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark {
        width: 84px; height: 84px; border-radius: 22px; background: #fff;
        box-shadow: 0 12px 34px rgba(0, 0, 0, .14), 0 3px 8px rgba(0, 0, 0, .08);
        display: grid; place-items: center; animation: splashPulse 2.2s ease-in-out infinite;
      }
      #splash svg { width: 46px; height: 46px; color: var(--splash-brand, #a36566); }
      @keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { #splash .mark { animation: none; } }
    </style>
    <script>
      // Match the saved brand colour before first paint (same key as lib/brand.ts).
      try {
        var b = localStorage.getItem("studio.brand");
        if (b && /^#[0-9a-f]{6}$/i.test(b)) document.documentElement.style.setProperty("--splash-brand", b);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash">
      <div class="mark">
        <svg viewBox="34 158 722 470" width="40" height="26" fill="none" aria-hidden="true"><path d="M66.5 606.5V270.5L149 188l82.5 82.5v60M149 188v225M66.5 495.5l304-304M370.5 191.5h121v118h-121zM66.5 606.5h125l415-415M73.5 606.5l297-297M606.5 191.5h123v118h-123zM307.5 490.5v116h124l298-298M309.5 606.5l297-297" stroke="currentColor" stroke-width="22" stroke-linecap="square"/><rect x="656" y="542" width="85" height="72" fill="currentColor"/></svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
