# Builds the Windows installer and publishes it as a GitHub release.
# Push a tag like v0.2.0 (or run it by hand from the Actions tab).
# Needs the repository secret LICENSE_PUBLIC_KEY: the App public key from studio.weborite.com/license/.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      owner:
        description: "Also build the owner copy (licensing off) as a private download on the run page. Never share it."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Check the license key secret
        shell: bash
        env:
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
        run: |
          if [ -z "$LICENSE_PUBLIC_KEY" ]; then
            echo "::error::Add the repository secret LICENSE_PUBLIC_KEY (Settings → Secrets and variables → Actions) with the App public key from studio.weborite.com/license/"
            exit 1
          fi

      - name: Build the customer installer
        run: npm run dist
        env:
          LICENSE_PUBLIC_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Weborite Studio ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: release/*.exe

      - name: Keep the installer on the run page (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: weborite-studio-installer
          path: release/*.exe
          retention-days: 14

      - name: Build the owner copy
        if: ${{ inputs.owner }}
        run: npm run dist:owner
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Keep the owner copy on the run page (private, 3 days)
        if: ${{ inputs.owner }}
        uses: actions/upload-artifact@v4
        with:
          name: weborite-studio-OWNER-do-not-share
          path: release-owner/*.exe
          retention-days: 3
